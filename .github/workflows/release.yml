name: Release

on:
  push:
    # tag runs can only restore caches that a main run saved
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - "**.md"

permissions:
  contents: read

env:
  IDF_VERSION: v6.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        id: firmware
        with:
          path: android/src/main/assets/firmware.bin
          key: firmware-${{ env.IDF_VERSION }}-${{ hashFiles('firmware/**') }}
      - name: Firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware "espressif/idf:$IDF_VERSION" \
            idf.py build merge-bin -o ../../android/src/main/assets/firmware.bin
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: App
        run: ./gradlew :android:assembleRelease
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir dist
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --out dist/fidont.apk android/build/outputs/apk/release/android-release-unsigned.apk
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Relay
        run: CGO_ENABLED=0 go build -C relay -trimpath -ldflags="-s -w" -o ../dist/fidont-relay-linux-x86_64
      - name: Checksums
        working-directory: dist
        run: |
          cp ../android/src/main/assets/firmware.bin .
          sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - run: cp dist/firmware.bin web-flasher/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web-flasher

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  flasher:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5.0.1
