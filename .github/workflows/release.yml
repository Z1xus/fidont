name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Firmware
        run: |
          mkdir dist
          docker run --rm -v "$PWD:/project" -w /project/firmware espressif/idf:v6.1 \
            idf.py build merge-bin -o ../../dist/firmware.bin
      - name: Sign firmware
        env:
          FIRMWARE_KEY: ${{ secrets.FIRMWARE_KEY }}
        run: |
          echo "$FIRMWARE_KEY" > "$RUNNER_TEMP/firmware.pem"
          { cat dist/firmware.bin; printf %s "${GITHUB_REF_NAME#v}"; } |
            openssl dgst -sha256 -sign "$RUNNER_TEMP/firmware.pem" -out dist/firmware.bin.sig
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: App
        run: ./gradlew :android:assembleRelease
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass env:KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out dist/fidont.apk android/build/outputs/apk/release/android-release-unsigned.apk
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false
      - name: Relay
        run: CGO_ENABLED=0 go build -C relay -trimpath -ldflags="-s -w" -o ../dist/fidont-relay-linux-x86_64
      - name: Helper
        run: |
          sudo apt-get install -y libdbus-1-dev
          cargo build --release --locked --manifest-path helper/Cargo.toml
          cp helper/target/release/fidont-helper dist/fidont-helper-linux-x86_64
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - run: cp dist/firmware.bin web-flasher/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web-flasher

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  flasher:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5.0.1
