name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Firmware
        run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware espressif/idf:v5.5.5 \
            idf.py build merge-bin -o ../../android/src/main/assets/firmware.bin
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: App
        run: ./gradlew :android:assembleRelease
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir dist
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/keystore.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --out dist/fidont.apk android/build/outputs/apk/release/android-release-unsigned.apk
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Relay
        run: CGO_ENABLED=0 go build -C relay -trimpath -ldflags="-s -w" -o ../dist/fidont-relay-linux-x86_64
      - name: Checksums
        working-directory: dist
        run: |
          cp ../android/src/main/assets/firmware.bin .
          rm -f fidont.apk.idsig
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  flasher:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - run: cp dist/firmware.bin web-flasher/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web-flasher
      - uses: actions/deploy-pages@v5.0.1
