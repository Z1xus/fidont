[package]
name = "fidont-helper"
version = "0.1.14"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
aes-gcm = "0.11.1"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time"] }

[profile.release]
strip = true
lto = true
